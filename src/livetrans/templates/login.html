<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
        .card{background:rgba(255,255,255,0.9);padding:40px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);width:100%;max-width:340px;text-align:center}
        input{width:100%;padding:14px;margin-bottom:20px;border:2px solid #e5e7eb;border-radius:10px;box-sizing:border-box}
        button{width:100%;padding:14px;background:#3b82f6;color:white;border:none;border-radius:10px;cursor:pointer}
        .error{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:8px;margin-bottom:20px}
    </style>
</head>
<body>
    <div class="card">
        <h2>AI 同传控制台（本地 ASR）</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="输入密码" required autofocus>
            <button type="submit">进入</button>
        </form>
    </div>
</body>
</html>
